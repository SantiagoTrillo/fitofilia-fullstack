<main>
  <div class="muro">
    <select #selectorFiltro (change)="filtrarPublicaciones(selectorFiltro.value)">
      <option disabled>Ordenar por</option>
      <option selected value="fecha">Fecha</option>
      <option value="corazones">Corazones</option>
    </select>
    @for (publicacion of publicacionesDisponibles(); track publicacion._id) {
      <hr>
      <app-publicacion [publicacion]="publicacion"/>
    }
    <hr>
  </div>
  <app-paginacion [cantidadPaginasDisponibles]="publicacionesDisponibles().length / 10"/>
</main>
