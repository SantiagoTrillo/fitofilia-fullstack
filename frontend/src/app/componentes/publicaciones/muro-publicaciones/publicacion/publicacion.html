<div class="contenedor-publicacion" >
  <div class="contenedor-autor">
    @if (publicacion().autor.fotoPerfil) { <img [src]="publicacion().autor.fotoPerfil" alt="Foto de perfil del autor"> }
    @else { <i class="fa-solid fa-circle-user icono-autor-predeterminado"></i> }
    <span>{{ publicacion().autor.nombreUsuario }}</span>
  </div>
  <div class="contenedor-contenido" (click)="abrirPublicacion(publicacion())">
    <h2>{{ publicacion().titulo }}</h2>
    @if (publicacion().imagen) {
      <div><img [src]="publicacion().imagen" alt="Imagen de una publicación"></div>
    } @else {
      <p class="cuerpo-publicacion">{{ publicacion().cuerpo }}</p>
    }
  </div>
  <div class="contenedor-botones">
    <button><i class="fa-regular fa-heart"></i><span>{{ publicacion().corazones }}</span></button>
    <button class="boton-comentarios" (click)="abrirPublicacion(publicacion())">
      <i class="fa-regular fa-comment"></i>{{ publicacion().comentarios?.length || 0 }}
    </button>
  </div>
</div>
