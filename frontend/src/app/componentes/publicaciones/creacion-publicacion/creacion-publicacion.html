<main>
  <app-formulario-usuario
    titulo="Crear nueva publicación"
    textoBotonPrimario="Publicar"
    textoBotonSecundario="Cancelar"
    tipoFormulario="creacionPublicacion"
    (formularioEnviado)="crearPublicacion($event)"
    (formularioModificado)="formularioModificado.set($event)"
  />
  @if (mostrarModalConfirmacion()) {
    <app-modal-confirmacion
      [mensaje]="'Tenés cambios sin guardar. ¿Estás seguro de que querés abandonar la página?'"
      (confirmar)="aceptarSalida()"
      (cancelar)="cancelarSalida()"
    />
  }
</main>
