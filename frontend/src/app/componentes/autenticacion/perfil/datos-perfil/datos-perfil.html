<section>
  <h3>Datos del perfil</h3>
  <ul>
    <label>Nombre: <li>{{ usuarioActual().nombre }}</li></label>
    <label>Apellido: <li>{{ usuarioActual().apellido }}</li></label>
    <label>Correo: <li>{{ usuarioActual().correo }}</li></label>
    <label>Nombre de usuario: <li>{{ usuarioActual().nombreUsuario }}</li></label>
    <label class="campo-ancho-completo">Fecha de nacimiento: <li>{{ usuarioActual().fechaNacimiento | date: "d/M/yyyy" }}</li></label>
    <label class="campo-ancho-completo">Descripción: <li [title]="usuarioActual().descripcion || ''">{{ usuarioActual().descripcion }}</li></label>
  </ul>
</section>
