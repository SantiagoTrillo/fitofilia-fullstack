<main>
  @if (autenticacionService.usuarioActual(); as usuarioActual) {
    <div class="titulo-perfil">
      <h1>Hola, {{ usuarioActual.nombre }}</h1>
      @if (usuarioActual.fotoPerfil) { <img [src]="usuarioActual.fotoPerfil" alt="Foto de perfil"> }
    </div>
    <div class="perfil">
      <app-datos-perfil [usuarioActual]="usuarioActual"/>
      <div class="botones">
        <button routerLink="/perfil/editar">Editar perfil</button>
        <button (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  }
</main>
