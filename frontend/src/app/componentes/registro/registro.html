<main>
  <div class="titulo"><h1>Registrate para poder acceder a la aplicación</h1></div>
  <section class="registro">
    <form [formGroup]="formularioRegistro" (ngSubmit)="registrarUsuario()">
      <label>Nombre: <input type="text" formControlName="nombre"></label>
      <label>Apellido: <input type="text" formControlName="apellido"></label>
      <label>Correo: <input type="email" formControlName="correo"></label>
      <label>Nombre de usuario: <input type="text" autocomplete="none" formControlName="nombreUsuario"></label>
      <label>Contraseña: <input type="password" autocomplete="new-password" formControlName="contrasenia"></label>
      <label>Repetir contraseña: <input type="password" formControlName="contraseniaRepetida"></label>
      <label>Fecha de nacimiento: <input type="date" formControlName="fechaNacimiento"></label>
      <label>Descripción breve: <textarea type="text" rows="3" maxlength="75" formControlName="descripcion"></textarea></label>
      <div class="foto-perfil">
        <h2>Subir foto de perfil</h2>
        <input #inputFotoPerfil type="file" accept="image/*" (change)="seleccionarImagen(inputFotoPerfil)">
      </div>
      <div>
        <button type="submit">Registrarse</button>
        <button type="button" routerLink="/inicio-sesión">Iniciar sesión</button>
      </div>
    </form>
  </section>
  @if (mostrarModalConfirmacion()) {
    <app-modal-confirmacion
      [mensaje]="'Tenés cambios sin guardar. ¿Estás seguro de que querés abandonar la página?'"
      (confirmar)="aceptarSalida()"
      (cancelar)="cancelarSalida()"
    />
  }
</main>
